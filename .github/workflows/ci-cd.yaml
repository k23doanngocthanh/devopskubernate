name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Kubernetes CLI
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
        
    - name: Validate Secrets
      run: |
          #!/bin/bash
          REQUIRED_SECRETS=("MYSQL_USER" "MYSQL_DATABASE" "MYSQL_ROOT_PASSWORD" "MYSQL_PASSWORD")

          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET}" ]; then
              echo "::error file=deploy.yml::Missing required secret: $SECRET"
              exit 1
            fi
          done

          echo "::notice::All required secrets are set."

    - name: Configure Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG" > ~/.kube/config

    - name: Deploy application to Kubernetes
      run: |
          kubectl apply -f k8s_config/storage/
          kubectl apply -f k8s_config/services/clusterissuer/
          kubectl apply -f k8s_config/services/registry/
          kubectl apply -f k8s_config/services/n8n/
          kubectl apply -f k8s_config/services/mysql/
          kubectl apply -f k8s_config/services/phpmyadmin/
          kubectl apply -f k8s_config/ingress/
          kubectl apply -f k8s_config/metallb/l2advertisement.yaml
