name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Kubernetes CLI
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Kubeconfig
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    - name: Deploy application to Kubernetes
      run: |
          kubectl apply -f k8s_config/storage/
          kubectl apply -f k8s_config/services/clusterissuer/
          kubectl apply -f k8s_config/services/registry/
          kubectl apply -f k8s_config/services/n8n/
          kubectl apply -f k8s_config/services/mysql/
          kubectl apply -f k8s_config/services/phpmyadmin/
          kubectl apply -f k8s_config/ingress/
          kubectl apply -f k8s_config/metallb/l2advertisement.yaml
