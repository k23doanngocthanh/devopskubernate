name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Kubernetes CLI
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
        
    - name: Check Secrets
      run: |
        #!/bin/bash
        if [ -z "$MYSQL_USER" ]; then
          echo "Error: MYSQL_USER is empty or null"
          exit 1
        fi
        if [ -z "$MYSQL_DATABASE" ]; then
          echo "Error: MYSQL_DATABASE is empty or null"
          exit 1
        fi
        if [ -z "$MYSQL_ROOT_PASSWORD" ]; then
          echo "Error: MYSQL_ROOT_PASSWORD is empty or null"
          exit 1
        fi
        if [ -z "$MYSQL_PASSWORD" ]; then
          echo "Error: MYSQL_PASSWORD is empty or null"
          exit 1
        fi
        if [ -z "$KUBECONFIG" ]; then
          echo "Error: KUBECONFIG is empty or null"
          exit 1
        fi
        echo "All secrets are present and have values."

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG" > ~/.kube/config

    - name: Deploy application to Kubernetes
      run: |
          kubectl apply -f k8s_config/storage/
          kubectl apply -f k8s_config/services/clusterissuer/
          kubectl apply -f k8s_config/services/registry/
          kubectl apply -f k8s_config/services/n8n/
          kubectl apply -f k8s_config/services/mysql/
          kubectl apply -f k8s_config/services/phpmyadmin/
          kubectl apply -f k8s_config/ingress/
          kubectl apply -f k8s_config/metallb/l2advertisement.yaml