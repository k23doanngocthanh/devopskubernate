apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mautic
  template:
    metadata:
      labels:
        app: mautic
    spec:
      containers:
      - name: mautic
        image: docker.io/mautic/mautic:latest
        ports:
          - containerPort: 80
        envFrom:
          - configMapRef:
              name: mysql-configmap
          - secretRef:
              name: mautic-secrets
        volumeMounts:
        - mountPath: /var/www/html/media
          name: mautic-storage
      volumes:
      - name: mautic-storage
        persistentVolumeClaim:
          claimName: mautic-pvc
