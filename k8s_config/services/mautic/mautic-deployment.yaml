apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mautic
  template:
    metadata:
      labels:
        app: mautic
    spec:
      containers:
      - name: mautic
        image: docker.io/mautic/mautic
        ports:
          - containerPort: 80
        env:
          - name: MAUTIC_DB_HOST
            valueFrom:
              configMapKeyRef:
                name: mysql-configmap
                key: MAUTIC_DB_HOST
          - name: MAUTIC_DB_PASSWORD
            valueFrom: { configMapKeyRef: { name: mysql-configmap, key: MAUTIC_DB_PASSWORD } }
        volumeMounts:
        - mountPath: /var/www/html/media
          name: mautic-storage
      volumes:
      - name: mautic-storage
        persistentVolumeClaim:
          claimName: mautic-pvc
