<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File: {{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        .highlight {
            background-color: #f0f0f0;
            padding: 10px;
            overflow: auto;
        }
        {{ formatter_style | safe }}
    </style>
</head>
<body>
    <div class="container">
        <h1>File: {{ filename }}</h1>
        <div class="highlight">
            {{ highlighted_content | safe }}
        </div>
        <a href="{{ url_for('edit', folder=folder, filename=filename) }}" class="btn btn-primary">Edit</a>
        <form method="POST" action="{{ url_for('apply', folder=folder, filename=filename) }}">
            <button type="submit" class="btn btn-success">Apply</button>
        </form>
        <a href="{{ url_for('folder', folder=folder) }}" class="btn btn-secondary">Back</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
