<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1>Apply Result</h1>
        <div class="mt-3">
            <h2>STDOUT</h2>
            <pre class="bg-light p-3 border rounded"><code>{{ stdout }}</code></pre>
        </div>
        <div class="mt-3">
            <h2>STDERR</h2>
            <pre class="bg-light p-3 border rounded"><code>{{ stderr }}</code></pre>
        </div>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Back to index</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
